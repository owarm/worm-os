# Worm OS target configuration for GrapheneOS 17 on Google Pixel 10.

WORM_OS_NAME="Worm OS"
WORM_DEVICE="frankel"
WORM_PRODUCT="Google Pixel 10"
WORM_KERNEL_FAMILY="muzel"

GRAPHENE_MANIFEST_URL="https://github.com/GrapheneOS/platform_manifest.git"
GRAPHENE_BRANCH="17"
GRAPHENE_REMOTE_NAME="graphene"

WORM_PATCH_DIR="patches/graphene"
WORM_OVERLAY_DIR="overlays/frankel"

# Keep the upstream checkout outside this repository. Override from the
# environment when a build host uses a different source layout.
GRAPHENE_SOURCE_DIR="${GRAPHENE_SOURCE_DIR:-$HOME/grapheneos-frankel-17}"

# Reserved integration points for adjacent Worm projects.
WORM_HOME_REPO="https://github.com/owarm/worm-home.git"
WORM_STORE_REPO="https://github.com/owarm/worm-store.git"
WORM_INSTALLER_REPO="https://github.com/owarm/worm-installer.git"
